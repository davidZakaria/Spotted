services:
  spotted-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spotted
      POSTGRES_PASSWORD: spotted
      POSTGRES_DB: spotted
    volumes:
      - spotted_postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotted -d spotted"]
      interval: 5s
      timeout: 5s
      retries: 10

  spotted-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  spotted-web:
    build:
      context: .
      target: runner
    ports:
      - "4721:4721"
    environment:
      DATABASE_URL: postgresql://spotted:spotted@spotted-db:5432/spotted
      REDIS_URL: redis://spotted-redis:6379
      APP_URL: http://localhost:4721
      AUTH_SECRET: ${AUTH_SECRET:-spotted-dev-secret-change-in-production-please}
      NODE_ENV: production
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-brave}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Spotted <alerts@localhost>}
    depends_on:
      spotted-db:
        condition: service_healthy
      spotted-redis:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts && node server.js"]

  spotted-worker:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://spotted:spotted@spotted-db:5432/spotted
      REDIS_URL: redis://spotted-redis:6379
      APP_URL: http://localhost:4721
      AUTH_SECRET: ${AUTH_SECRET:-spotted-dev-secret-change-in-production-please}
      NODE_ENV: production
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-brave}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      spotted-db:
        condition: service_healthy
      spotted-redis:
        condition: service_healthy
    command: ["npx", "tsx", "src/worker.ts"]

volumes:
  spotted_postgres:
